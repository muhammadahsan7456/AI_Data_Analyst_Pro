<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Too many attempts | AI Data Analyst Pro</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}?v=2"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mono.css') }}?v=20261121">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--mono-bg); color: var(--mono-text); font-family: var(--mono-font); padding: 24px; }
        .box { max-width: 460px; border: 1px solid var(--mono-border); border-radius: var(--mono-radius-lg); background: var(--mono-surface); padding: 32px; text-align: center; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { font-size: 16px; line-height: 1.6; color: var(--mono-text-2); margin: 0 0 20px; }
        a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px; border-radius: var(--mono-radius); background: var(--mono-ink); color: var(--mono-on-ink); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main class="box">
        <h1>Too many attempts</h1>
        <p>For your security, this action is paused for this network. Please wait about {{ minutes }} minute{{ 's' if minutes != 1 else '' }} and try again.</p>
        <a href="{{ back_url }}">Go back</a>
    </main>
</body>
</html>
