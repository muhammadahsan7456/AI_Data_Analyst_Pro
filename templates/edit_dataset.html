{% extends "base.html" %}

{% block title %}Rename Dataset | AI Data Analyst Pro{% endblock %}
{% block header_title %}Rename Dataset{% endblock %}
{% block header_subtitle %}Update display name for dataset ID #{{ dataset[0] }}{% endblock %}

{% block content %}
<div class="table-card" style="max-width: 600px;">
    <form method="POST">
        <div style="margin-bottom: 20px;">
            <label for="dataset_name" style="font-weight: 700; display: block; margin-bottom: 8px;">Dataset Display Name</label>
            <input type="text" id="dataset_name" name="dataset_name" value="{{ dataset[2] }}" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: var(--bg-surface); color: var(--text-primary); font-size: 15px;">
        </div>

        <div style="display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> Save Name
            </button>
            <a href="{{ url_for('frontend.dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
