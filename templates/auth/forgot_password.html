{% extends "landing_base.html" %}

{% block seo_meta %}
<title>Forgot Password — AI Data Analyst Pro</title>
<meta name="description" content="Reset your AI Data Analyst Pro account password. Enter your registered email address to receive a 6-digit verification code.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="{{ request.url }}">
{% endblock %}

{% block content %}
<div class="auth-luxury-page">
    <div class="auth-luxury-card">
        <div class="auth-brand-badge">
            <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your registered email address below and we'll send you a 6-digit password reset code.</p>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="auth-form-group">
                <label for="email" class="auth-label">
                    Email Address
                </label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" name="email" id="email" required placeholder="name@company.com" autocomplete="email" class="auth-input">
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Code
            </button>
        </form>

        <div class="auth-footer-links">
            <a href="{{ url_for('auth.login') }}">
                <i class="fa-solid fa-arrow-left"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
